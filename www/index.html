  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="manifest" href="site.webmanifest" />
  <link href="dist/index.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/lucide-static@1.17.0/font/lucide.css" />
  <title>Engx</title>
  <meta name="title" />
  <meta name="description" content="Software Introduction into Software Engineering" />
  <meta name="keywords" content="&quot;engineering&quot;,&quot;handbook&quot;" />

  <meta property="og:type" content="website" />

  <meta property="twitter:card" content="summary_large_image" />

  <script type="application/ld+json"></script>
  <!-- Offline support -->
  <script>
    if ('serviceWorker' in navigator && window.location.hostname !== 'localhost') {
      window.addEventListener('load', () => navigator.serviceWorker.register('/service-worker.js'));
    }
  </script>
</head>

<body></body>
<script type="module">
  window.R = {
    app: {
      "id": "engx",
      "name": "Engx",
      "logo": "/favicon.svg",
      "version": "1.0.0",
      "description": "Engx - Software Introduction into Software Engineering",
      "author": "Company, Inc",
      "keywords": ["engineering", "handbook"],
      "email": "contact@company.com",
      // Empty on purpose: the engx docs use repo-relative image refs (`../images/x.png`)
      // so they still render on GitHub. The app is hash-routed, so the document URL is
      // always "/" and the browser clamps those `..` at root → /images/x.png, which the
      // `www/images` symlink serves. Almaat instead uses absolute refs + a "/site" prefix.
      imageSrcBase: "",
      "copyright": "© 2025. All rights reserved."
    },
    docsServiceProps: {
      indexUrl: "/site/index.json",
      resolvePattern: "/site/docs/{id}"
    }
  }
</script>
<script src="dist/index.js" type="module"></script>

</html>
